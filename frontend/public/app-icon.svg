<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich red gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4D"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Subtle inner gloss/bevel -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop shadow for the white icon badge -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4C0519" flood-opacity="0.45"/>
    </filter>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle (iOS App Icon Shape) -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#redGrad)"/>

  <!-- Top Glass Highlight Overlay -->
  <rect x="20" y="20" width="472" height="240" rx="108" ry="108" fill="url(#glossGrad)"/>

  <!-- Border Ring -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>

  <!-- Icon Graphic (Clean Pure White Stock & Delivery Icon with Cart/Truck/Box motif) -->
  <g filter="url(#badgeShadow)" transform="translate(0, 0)">
    
    <!-- Delivery / Van Sales Truck Body (White) -->
    <g fill="#FFFFFF" filter="url(#iconGlow)">
      <!-- Main Truck Cargo Container / Stock Box -->
      <rect x="110" y="160" width="190" height="150" rx="22" ry="22"/>

      <!-- Truck Front Cab -->
      <path d="M305 200 L350 200 C364 200 376 210 380 224 L396 270 C398 276 400 282 400 288 L400 300 C400 306 395 310 389 310 L305 310 Z"/>

      <!-- Truck Cab Windshield Cutout (Red contrast) -->
      <path d="M315 212 L345 212 C353 212 360 218 363 226 L373 256 C374 260 371 264 367 264 L315 264 Z" fill="url(#redGrad)"/>

      <!-- Inventory Stock Box Graphic inside Cargo Box (Carved/Overlay) -->
      <!-- Center Emblem: 3D Cube / Stock Package with Speed lines -->
      <path d="M205 190 L160 212 L205 234 L250 212 Z" fill="url(#redGrad)"/>
      <path d="M155 220 L155 264 L200 286 L200 242 Z" fill="url(#redGrad)" opacity="0.9"/>
      <path d="M210 242 L210 286 L255 264 L255 220 Z" fill="url(#redGrad)" opacity="0.75"/>

      <!-- Wheels (Outer White, Inner Red) -->
      <!-- Wheel 1 -->
      <circle cx="170" cy="316" r="38" fill="#FFFFFF"/>
      <circle cx="170" cy="316" r="22" fill="#E11D48"/>
      <circle cx="170" cy="316" r="10" fill="#FFFFFF"/>

      <!-- Wheel 2 -->
      <circle cx="346" cy="316" r="38" fill="#FFFFFF"/>
      <circle cx="346" cy="316" r="22" fill="#E11D48"/>
      <circle cx="346" cy="316" r="10" fill="#FFFFFF"/>
    </g>

    <!-- Speed / Distribution Waves (Rep / Field Sales on the move) -->
    <path d="M80 205 L100 205" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M65 235 L95 235" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M75 265 L100 265" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>

    <!-- Bottom Badge Text "REP POS" (Clean, Bold, Modern) -->
    <g transform="translate(256, 404)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="34" 
            font-weight="900" 
            letter-spacing="6" 
            fill="#FFFFFF" 
            opacity="0.95">SALES REP</text>
    </g>

    <!-- Sparkle / Star Indicator (New / Verified) -->
    <path d="M370 148 L374 162 L388 166 L374 170 L370 184 L366 170 L352 166 L366 162 Z" fill="#FFFFFF"/>
  </g>
</svg>
